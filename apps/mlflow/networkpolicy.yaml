apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-allow-mlflow
  namespace: kubeflow
spec:
  podSelector: { matchLabels: { app: seaweedfs } }
  policyTypes: [Ingress]
  ingress:
  - from: [{ podSelector: { matchLabels: { app: mlflow } } }]
    ports: [{ port: 8333, protocol: TCP }]